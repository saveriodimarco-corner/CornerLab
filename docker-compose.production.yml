version: "3.9"

services:
  cornerlab:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: cornerlab:production
    volumes:
      - ./data:/srv/cornerlab/data
      - ./models:/srv/cornerlab/models:ro
      - ./reports:/srv/cornerlab/reports
    env_file:
      - .env
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      CORNERLAB_APP_PASSWORD: ${CORNERLAB_APP_PASSWORD}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY}
      CORNERLAB_TELEGRAM_ENABLED: ${CORNERLAB_TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.example:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      cornerlab:
        condition: service_healthy
    restart: unless-stopped
